<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">Atty. Bel Zamora Digital District Office for San Juan City</title>
    <desc id="desc">Official public-service portal social preview image using the Cong. Bel Zamora logo and official seals.</desc>
    <defs>
        <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#d62828"/>
            <stop offset="0.46" stop-color="#8f263f"/>
            <stop offset="1" stop-color="#0b1f3a"/>
        </linearGradient>
        <linearGradient id="goldLine" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#c9a227"/>
            <stop offset="0.55" stop-color="#f1d56a"/>
            <stop offset="1" stop-color="#1746a2"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#061226" flood-opacity="0.35"/>
        </filter>
    </defs>

    <rect width="1200" height="630" fill="url(#hero)"/>
    <path d="M0 0h1200v630H0z" fill="none"/>
    <path d="M0 112h1200" stroke="url(#goldLine)" stroke-width="8"/>
    <g opacity="0.12">
        <path d="M-120 620 520-20" stroke="#ffffff" stroke-width="2"/>
        <path d="M20 650 670 0" stroke="#ffffff" stroke-width="2"/>
        <path d="M220 690 900 10" stroke="#ffffff" stroke-width="2"/>
        <path d="M780 650 1260 170" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g transform="translate(78 72)">
        <image href="CongBelLogo_tight.png" x="0" y="0" width="235" height="94" preserveAspectRatio="xMidYMid meet"/>
        <text x="260" y="42" fill="#ffffff" font-family="Instrument Sans, Aptos, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">
            Digital District Office for San Juan City
        </text>
        <text x="262" y="84" fill="#f1d56a" font-family="Instrument Sans, Aptos, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="7">
            OFFICIAL CONSTITUENT-SERVICES PORTAL
        </text>
    </g>

    <g transform="translate(78 210)">
        <text x="0" y="0" fill="#f1d56a" font-family="Instrument Sans, Aptos, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="4">
            LONE DISTRICT OF SAN JUAN CITY
        </text>
        <text x="0" y="74" fill="#ffffff" font-family="Georgia, Iowan Old Style, serif" font-size="72" font-weight="700">
            Atty.
        </text>
        <text x="0" y="152" fill="#ffffff" font-family="Georgia, Iowan Old Style, serif" font-size="70" font-weight="700">
            Congresswoman
        </text>
        <text x="0" y="238" fill="#ffffff" font-family="Georgia, Iowan Old Style, serif" font-size="86" font-weight="700">
            Bel Zamora
        </text>
        <text x="2" y="294" fill="#ffffff" opacity="0.92" font-family="Instrument Sans, Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">
            Verified programs, legislation, projects, and assistance.
        </text>
    </g>

    <g transform="translate(804 226)" filter="url(#softShadow)">
        <rect x="0" y="0" width="318" height="272" rx="16" fill="#ffffff"/>
        <image href="CongBelLogo_tight.png" x="48" y="42" width="222" height="88" preserveAspectRatio="xMidYMid meet"/>
        <line x1="54" x2="264" y1="156" y2="156" stroke="#d9dee7" stroke-width="2"/>
        <image href="House_of_Representative_Logo_Seal.svg" x="80" y="178" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
        <image href="Logo_of_San_Juan_Seal.svg" x="176" y="178" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
    </g>
</svg>
